<title>Sports Center Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout concept: a desktop (WPF-style) window with a role-aware side menu and one work area per screen. */
:root{
  --bg:#eef1ef; --surface:#ffffff; --surface2:#f5f7f6; --line:#d9dfdc; --ink:#15211e; --muted:#5c6b66;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d6efeb; --warm:#d9611f; --warm-soft:#fbe6d9;
  --ok:#17803d; --ok-soft:#d9f1e1; --bad:#b42318; --bad-soft:#fbe0dd; --warn:#a15c07; --warn-soft:#faebcc;
  --title:#1d2b28; --title-ink:#e8eeec;
  --font-head:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif; --font-body:'Inter','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#172220; --surface2:#1d2b28; --line:#2c3d39; --ink:#e6eeeb; --muted:#93a59f;
  --accent:#2bb3a6; --accent-ink:#04201d; --accent-soft:#123a36; --warm:#f08a4b; --warm-soft:#3a2415;
  --ok:#4cc27a; --ok-soft:#14331f; --bad:#f26d60; --bad-soft:#3b1815; --warn:#e6b04b; --warn-soft:#38290c;
  --title:#0a100f; --title-ink:#b9c9c4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#172220; --surface2:#1d2b28; --line:#2c3d39; --ink:#e6eeeb; --muted:#93a59f;
  --accent:#2bb3a6; --accent-ink:#04201d; --accent-soft:#123a36; --warm:#f08a4b; --warm-soft:#3a2415;
  --ok:#4cc27a; --ok-soft:#14331f; --bad:#f26d60; --bad-soft:#3b1815; --warn:#e6b04b; --warn-soft:#38290c;
  --title:#0a100f; --title-ink:#b9c9c4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
.win{max-width:1180px;margin:0 auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);
  box-shadow:0 10px 30px rgba(0,0,0,.12)}
.titlebar{display:flex;align-items:center;gap:10px;background:var(--title);color:var(--title-ink);padding:8px 12px;font-size:12px}
.titlebar .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.titlebar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar .wbtn{display:flex;gap:14px;opacity:.7;letter-spacing:2px}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:620px}
.side{background:var(--surface2);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.me{padding:6px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.me b{display:block;font-family:var(--font-head);font-size:14px}
.me span{font-size:12px;color:var(--muted)}
.rolechip{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;gap:8px;color:var(--ink)}
.nav button:hover{background:var(--line)}
.nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav button small{opacity:.5;font-size:10px;align-self:center}
.nav button.ng{font-weight:600}
.nav button.ng .chev{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);align-self:center;opacity:.55;transition:transform .15s}
.nav button.ng.open .chev{transform:rotate(45deg)}
.nav button.ng.has:not(.open){color:var(--accent)}
.nav .sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 8px 12px;padding-left:8px;border-left:2px solid var(--line)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
main{padding:20px 22px 28px;min-width:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:20px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag b{color:var(--accent)}
.grp{border:1px solid var(--line);border-radius:8px;margin:0 0 14px;padding:0;background:var(--surface);min-width:0}
.grp>legend,.grp>.gh{display:block;font-family:var(--font-head);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:8px 12px;border-bottom:1px solid var(--line);width:100%;background:var(--surface2);border-radius:8px 8px 0 0}
.gb{padding:12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;min-width:130px;flex:1}
.f label{font-size:12px;color:var(--muted)}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:7px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.d{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.s{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.sel td{background:var(--accent-soft)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.mute{background:var(--line);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface)}
.kpi span{font-size:12px;color:var(--muted)} .kpi b{display:block;font-family:var(--font-head);font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)} .bar i.full{background:var(--warm)}
.note{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.note.ok{border-color:var(--ok);background:var(--ok-soft)} .note.bad{border-color:var(--bad);background:var(--bad-soft)}
.pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pkg{border:2px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;background:var(--surface)}
.pkg.on{border-color:var(--accent);background:var(--accent-soft)}
.pkg b{font-family:var(--font-head)} .pkg .pr{font-size:18px;font-weight:600;margin:4px 0;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{cursor:pointer;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:6px 14px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:8px;min-height:110px;padding:8px;background:var(--surface);min-width:0}
.day h4{margin:0 0 6px;font-family:var(--font-head);font-size:12px;color:var(--muted)}
.ev{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:4px;padding:5px 7px;margin-bottom:6px;font-size:12px;overflow-wrap:anywhere}
.ev small{display:block;color:var(--muted)}
.inv{border:1px dashed var(--line);border-radius:8px;padding:14px;background:var(--surface2);font-size:13px}
.inv h3{font-size:15px;margin-bottom:8px}
.inv dl{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:0}
.inv dt{color:var(--muted)} .inv dd{margin:0}
.login{max-width:430px;margin:40px auto;padding:0 16px 40px}
.login h1{font-size:26px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips .btn{flex:1}
.hint{color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-size:13px;max-width:min(560px,92vw);z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.bad{background:var(--bad);color:#fff}
.ov{position:fixed;inset:0;background:rgba(10,20,18,.45);display:grid;place-items:center;padding:16px;z-index:40}
.dlg{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dlg h3{font-family:var(--font-head);font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
.dlgbtn{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 14px;margin:0 0 6px;border-radius:6px;cursor:pointer;text-align:left;font-size:14px;background:var(--bad-soft);border:1px solid var(--bad);color:var(--ink)}
.arow.on{background:var(--accent-soft);border-color:var(--accent)}
.arow b{font-size:13px;color:var(--bad)} .arow.on b{color:var(--accent)}
.arow:hover{opacity:.85}
.sum{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.err{color:var(--bad);font-size:12px}.err:empty{display:none}
input[aria-invalid="true"]{border-color:var(--bad)}
.pw{display:flex;gap:6px}.pw input{flex:1}
.eye{cursor:pointer;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:0 12px;font-size:12px}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tt{min-width:780px;table-layout:fixed}
.tt th,.tt td{border:1px solid var(--line);vertical-align:top;text-align:center}
.tt td{height:76px;padding:6px}
.tt th:first-child,.tt td:first-child{width:92px;text-align:left;background:var(--surface2)}
.tt .ev{margin:0;text-align:left}
.tt th.today{background:var(--accent-soft);color:var(--accent)}
.tt td.today{background:var(--surface2)}
.tt td.has{background:var(--accent-soft)}
.tt .ev{background:transparent;border-left:0;padding:0}
.tt .ev b{display:block;margin-bottom:2px}
.pgbar{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px}
.pager{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pg{cursor:pointer;width:34px;height:34px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;font-size:14px}
.pg:hover:not([disabled]){border-color:var(--warm)}
.pg.on{background:var(--warm);border-color:var(--warm);color:#fff;font-weight:600}
.pg[disabled]{opacity:.4;cursor:not-allowed}
.scroll{max-height:360px;overflow-y:auto}
.scroll th{position:sticky;top:0}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:10px}
  .nav .sub{margin-left:6px}
  .sidefoot{margin-top:6px}
  .two{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  main{padding:16px 12px 24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>

const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

const dow=d=>((new Date(d).getDay()+6)%7)+1;
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};

/* Phân trang: « ‹ 1 2 3 4 5 › » , trang hiện tại tô cam. Chỉ hiện khi có nhiều hơn PAGE dòng. */
const PAGE=8;
function pager(key,p,pages){
  const s=Math.max(1,Math.min(p-2,pages-4)),e=Math.min(pages,s+4);
  const b=(label,to,cls,dis,aria)=>`<button type="button" class="pg ${cls}" data-act="page" data-k="${key}" data-p="${to}" ${dis?'disabled':''} aria-label="${aria}">${label}</button>`;
  let nums='';for(let i=s;i<=e;i++)nums+=b(i,i,i===p?'on':'',false,'Trang '+i);
  return `<nav class="pager" aria-label="Phân trang">${b('«',1,'',p===1,'Trang đầu')}${b('‹',p-1,'',p===1,'Trang trước')}${nums}${b('›',p+1,'',p===pages,'Trang sau')}${b('»',pages,'',p===pages,'Trang cuối')}</nav>`}
/* Dùng chung cho mọi danh sách (bảng hay danh sách thẻ): cắt theo trang và dựng thanh phân trang */
function paginate(key,items){
  if(!key||items.length<=PAGE)return{items,foot:''};
  const pages=Math.ceil(items.length/PAGE),p=Math.min(Math.max(S.page[key]||1,1),pages),from=(p-1)*PAGE;S.page[key]=p;
  return{items:items.slice(from,from+PAGE),foot:`<div class="pgbar">${pager(key,p,pages)}<span class="hint">Hiển thị ${from+1}-${Math.min(from+PAGE,items.length)} trên ${items.length}</span></div>`}}
const tbl=(cols,rows,empty='Chưa có dữ liệu',key)=>{
  const pg=paginate(key,rows);rows=pg.items;
  return `<div class="tw ${key?'':'scroll'}"><table><thead><tr>${cols.map(c=>`<th class="${c[1]||''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${cols.length}" class="hint">${empty}</td></tr>`}</tbody></table></div>${pg.foot}`};

/* Thời khóa biểu tuần kiểu FAP: tiêu đề có ngày, cột hôm nay tô sáng, kết quả điểm danh nằm ngay trong ô lớp */
function sMySchedule(){
  const mid=memberCtx();
  const ws=addDays(T,-(dow(T)-1)+7*S.weekOff),days=[0,1,2,3,4,5,6].map(i=>addDays(ws,i));
  const regs=D.regs.filter(r=>r.memberId==mid);
  const active=new Set(regs.filter(r=>r.status==='Registered').map(r=>r.classId));
  const attOf=(c,date)=>regs.filter(r=>r.classId===c.id).map(r=>D.att.find(a=>a.regId===r.id&&a.date===iso(date))).find(Boolean);
  const classOf=(d,sl,date)=>D.classes.find(c=>c.day===d&&c.slotId===sl.id&&regs.some(r=>r.classId===c.id)&&(attOf(c,date)||(active.has(c.id)&&c.status!=='Cancelled')));
  const isToday=date=>date.getTime()===T.getTime();
  let pre=0,abs=0,pen=0,tot=0;
  const cell=(d,sl,date)=>{
    const c=classOf(d,sl,date),td=isToday(date)?' today':'';
    if(!c)return `<td class="${td}"></td>`;
    const a=attOf(c,date),past=date<T;tot++;
    if(a){a.st==='Present'?pre++:abs++}else if(past)pen++;
    const badge=a?(a.st==='Present'?pill('✓ Có mặt','ok'):pill('✗ Vắng','bad')):(past?pill('Chưa điểm danh','mute'):'');
    return `<td class="has${td}"><div class="ev"><b>${esc(c.code)} · ${esc(c.name)}</b>${badge?`<div>${badge}</div>`:''}<small>${sl.s}-${sl.e}</small><small>${esc(byId(D.rooms,c.roomId).name)}</small><small>${esc(byId(D.coaches,c.coachId).name)}</small></div></td>`};
  const body=D.slots.map(sl=>`<tr><td><b>${sl.name}</b><br><span class="hint">${sl.s}-${sl.e}</span></td>${days.map((date,i)=>cell(i+1,sl,date)).join('')}</tr>`).join('');
  const fm=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
  const sum=tot?`Trong tuần: ${pre} buổi có mặt, ${abs} buổi vắng, ${pen} buổi chưa điểm danh.`:'Tuần này không có buổi học nào.';
  return head('myschedule')+`<div class="row" style="margin-bottom:6px;align-items:center"><b style="font-size:16px;margin-right:12px">Tuần (${fm(days[0])} - ${fm(days[6])})</b>
    <button class="btn" data-act="weekPrev">‹ Tuần trước</button><button class="btn" data-act="weekToday">Tuần này</button><button class="btn" data-act="weekNext">Tuần sau ›</button></div>
  <div class="hint" style="margin-bottom:8px">${sum}</div>
  <div class="tw"><table class="tt"><thead><tr><th>Ca</th>${days.map((date,i)=>`<th class="${isToday(date)?'today':''}">${DAYFULL[i+1]}<br><span class="hint">(${fm(date)})</span></th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`}

/* Điểm danh: chọn lớp rồi chọn BUỔI học trong danh sách (không phải tự chọn ngày); bấm cả dòng học viên để đổi Có mặt / Vắng.
   Giống AttendancePage trong app. */
const CLASS_SESSIONS=12;
function sessionDates(c){const out=[];let d=T;while(dow(d)!==c.day)d=addDays(d,-1);for(let i=0;i<CLASS_SESSIONS;i++){out.push(iso(d));d=addDays(d,-7)}return out}
const attStatus=rid=>S.attDraft[rid]||D.att.find(a=>a.regId===rid&&a.date===S.attDate)?.st||'Present';
function sAttendance(){
  const co=S.user.role==='Coach'?(D.coaches.find(c=>c.userId===S.user.id)||D.coaches[0]):null;
  const cls=D.classes.filter(c=>!co||c.coachId===co.id);
  if(!S.attClass||!cls.find(c=>c.id==S.attClass))S.attClass=cls[0]?.id;
  const c=byId(D.classes,S.attClass);
  const sess=c?sessionDates(c):[];
  if(!sess.includes(S.attDate))S.attDate=sess[0]||'';
  const regs=c?D.regs.filter(r=>r.classId===c.id&&r.status==='Registered'):[];
  const present=regs.filter(r=>attStatus(r.id)==='Present').length;
  const pg=paginate('att',regs);
  return head('attendance')+`<div class="grp"><div class="gh">Chọn buổi học</div><div class="gb"><div class="row"><div class="f"><label for="ac">Lớp</label><select id="ac" data-chg="setAttClass">${cls.map(x=>`<option value="${x.id}" ${x.id==S.attClass?'selected':''}>${esc(x.code)} · ${DAYS[x.day]} ${x.s}</option>`).join('')}</select></div>
  <div class="f"><label for="ad">Buổi học (mới nhất trước)</label><select id="ad" data-chg="setAttDate">${sess.map(s=>`<option value="${s}" ${s===S.attDate?'selected':''}>${DAYFULL[c.day]} ${fd(s+'T00:00:00')}${s===iso(T)?' (hôm nay)':''}</option>`).join('')}</select></div></div></div></div>
  <div class="grp"><div class="gh">Danh sách điểm danh (bấm vào cả dòng để đổi Có mặt / Vắng)</div><div class="gb">
  <div class="sum"><b>${regs.length?`Có mặt ${present}/${regs.length} · Vắng ${regs.length-present}`:''}</b><span><button class="btn" data-act="attAll" data-v="Present">Có mặt tất cả</button> <button class="btn" data-act="attAll" data-v="Absent">Vắng tất cả</button></span></div>
  ${regs.length?pg.items.map(r=>{const p=attStatus(r.id)==='Present';return `<button type="button" class="arow ${p?'on':''}" data-act="togAtt" data-id="${r.id}" aria-pressed="${p}"><span>${esc(memberName(r.memberId))}</span><b>${p?'✓ Có mặt':'✗ Vắng'}</b></button>`}).join('')+pg.foot:'<div class="hint">Lớp chưa có học viên.</div>'}
  <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn p" data-act="saveAtt">Lưu điểm danh</button></div>
  </div></div>`}

/* ============ actions ============ */
const ACT={
  login(){const u=D.users.find(x=>x.username===v('lu').trim());
    if(!u||v('lp')!==(u.pw||'123456'))return toast('Sai tên đăng nhập hoặc mật khẩu.',true);
    if(!u.active)return toast('Tài khoản đã bị khóa.',true);loginAs(u)},
  quick(el){loginAs(D.users.find(x=>x.username===el.dataset.u))},

  togglePw(el){const show=el.textContent==='Hiện';['rp','rp2','np','np2'].forEach(i=>{const x=document.getElementById(i);if(x)x.type=show?'text':'password'});el.textContent=show?'Ẩn':'Hiện'},
  register(){const n=v('rn').trim(),ph=v('rph').trim(),u=v('ru').trim(),p=v('rp'),p2=v('rp2'),E={};
    if(!n)E.rn='Vui lòng nhập họ tên.';
    if(!ph)E.rph='Vui lòng nhập số điện thoại.';else if(!/^0\d{9,10}$/.test(ph))E.rph='Số điện thoại gồm 10-11 chữ số, bắt đầu bằng 0.';else if(D.members.some(m=>m.userId&&m.phone===ph&&normName(m.name)===normName(n)))E.rph='Họ tên và số điện thoại này đã có tài khoản. Hãy đăng nhập, hoặc nhờ lễ tân nếu quên mật khẩu.';
    if(!u)E.ru='Vui lòng nhập tên đăng nhập.';else if(D.users.some(x=>x.username.toLowerCase()===u.toLowerCase()))E.ru='Tên đăng nhập này đã có người dùng.';
    if(!p)E.rp='Vui lòng nhập mật khẩu.';else if(p.length<6)E.rp='Mật khẩu cần ít nhất 6 ký tự.';else if(p.toLowerCase()===u.toLowerCase())E.rp='Mật khẩu không được trùng tên đăng nhập.';
    if(!p2)E.rp2='Vui lòng nhập lại mật khẩu.';else if(p!==p2)E.rp2='Hai mật khẩu chưa khớp.';
    document.querySelectorAll('.err').forEach(x=>x.textContent='');document.querySelectorAll('[aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));

    /* Khớp CẢ số điện thoại LẪN họ tên (không phân biệt hoa thường và dấu), chỉ đề nghị gắn khi có đúng một hồ sơ */
    const norm=s=>s.toLowerCase().replace(/đ/g,'d').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().split(/\s+/).join(' ');
    const matches=D.members.filter(m=>!m.userId&&m.phone===ph&&norm(m.name)===norm(n));
    if(matches.length===1){S.regConfirm={n,ph,u,p,mid:matches[0].id};render();return}

    /* cùng họ tên VÀ cùng SĐT = cùng một người: không tạo thêm */
    const same=D.members.find(m=>m.phone===ph&&normName(m.name)===normName(n));
    if(same)return toast('Đã có member "'+same.name+'" (#'+same.id+') cùng họ tên và số điện thoại ('+(same.userId?'đã có tài khoản':'đăng ký tại quầy')+'). Không tạo thêm hồ sơ trùng.',true);
    /* cùng SĐT khác họ tên (người nhà dùng chung số): hỏi lại; bấm Đăng ký lần nữa để xác nhận */
    const other=D.members.find(m=>m.phone===ph&&normName(m.name)!==normName(n));
    if(other&&!(S.memForce&&S.memForce.n===n&&S.memForce.ph===ph)){S.memForce={n,ph};return toast('Số '+ph+' đang dùng cho member "'+other.name+'". Nếu là người nhà dùng chung số, bấm Đăng ký lần nữa để tạo hồ sơ mới.',true)}
    S.memForce=null;
    D.members.push({id:D.members.length+1,userId:null,name:n,phone:ph,email:em});log('CreateMember',n);toast('Đã đăng ký member mới tại quầy.');main()},
  buyFor(el){S.actMember=+el.dataset.id;S.screen='buy';S.open=undefined;render()},
  /* buy */
  pickPkg(el){S.pkg=+el.dataset.id;main()},
  buy(){const mid=memberCtx(),pk=byId(D.packages,S.pkg);
    const start=nextStart(mid),sub={id:D.subs.length+1,memberId:mid,pkgId:pk.id,start,end:addDays(start,pk.days-1),status:'Active'};
    D.subs.push(sub);const no=nextInvoice();
    D.pays.push({no,memberId:mid,subId:sub.id,amt:pk.price,method:v('pm'),at:new Date(),status:'Paid',note:'Mua '+pk.name});
    log('Payment','Thu '+no+' '+money(pk.price));S.pkg=null;S.sel=no;toast('Đã tạo gói và hóa đơn '+no+'.');main()},
  /* booking */
  setMember(el){S.actMember=+el.value;main()},
  reg(el){const err=tryRegister(memberCtx(),+el.dataset.id);if(err)return toast(err,true);toast('Đăng ký lớp thành công.');main()},
  cancelReg(el){const c=byId(D.classes,el.dataset.id),r=myReg(memberCtx(),c.id),ns=nextSession(c);
    if(ns&&ns-new Date()<CANCEL_HOURS*3600*1000)return toast('Chỉ được hủy trước giờ học hơn '+CANCEL_HOURS+' giờ.',true);
    r.status='Cancelled';r.cancelledAt=new Date();log('CancelClass','Hủy '+memberName(r.memberId)+' khỏi '+c.code);toast('Đã hủy đăng ký lớp '+c.code+'.');main()},
  /* payments */
  selPay(el){S.sel=el.dataset.id;main()},
  exportInv(){toast('Đã xuất hóa đơn ra file (mô phỏng, bản thật ghi file .txt/.csv).')},
  /* users */
  setRole(el){const u=byId(D.users,el.dataset.id);u.role=el.value;log('SetRole',u.username+' → '+u.role);toast('Đã đổi role.')},
  toggleUser(el){const u=byId(D.users,el.dataset.id);u.active=!u.active;log('ToggleUser',u.username);main()},
  addUser(){const n=v('un').trim(),u=v('uu').trim();if(!n||!u)return toast('Nhập họ tên và username.',true);if(D.users.some(x=>x.username===u))return toast('Username đã tồn tại.',true);
    const nu={id:D.users.length+1,username:u,name:n,role:v('ur'),active:true};D.users.push(nu);
    if(nu.role==='Coach')D.coaches.push({id:D.coaches.length+1,name:n,spec:'',userId:nu.id});
    if(nu.role==='Member')D.members.push({id:D.members.length+1,userId:nu.id,name:n,phone:'',email:''});
    log('CreateUser',u);main()},
  changePw(){const u=byId(D.users,S.user.id),op=v('op'),np=v('np'),np2=v('np2'),E={};
    if(!op)E.op='Vui lòng nhập mật khẩu hiện tại.';else if(op!==(u.pw||'123456'))E.op='Mật khẩu hiện tại chưa đúng.';
    if(!np)E.np='Vui lòng nhập mật khẩu mới.';else if(np.length<6)E.np='Mật khẩu cần ít nhất 6 ký tự.';else if(np===op)E.np='Mật khẩu mới phải khác mật khẩu hiện tại.';else if(np.toLowerCase()===u.username.toLowerCase())E.np='Mật khẩu không được trùng tên đăng nhập.';
    if(!np2)E.np2='Vui lòng nhập lại mật khẩu mới.';else if(np!==np2)E.np2='Hai mật khẩu chưa khớp.';
    document.querySelectorAll('.err').forEach(x=>x.textContent='');document.querySelectorAll('[aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));
    const keys=Object.keys(E);
    if(keys.length){keys.forEach(k=>{document.getElementById('e-'+k).textContent=E[k];document.getElementById(k).setAttribute('aria-invalid','true')});document.getElementById(keys[0]).focus();return}
    u.pw=np;log('ChangePassword',u.username);S.pwOpen=false;render();toast('Đã đổi mật khẩu. Lần đăng nhập sau dùng mật khẩu mới.')},
  /* report + attendance */
  repApply(){const a=v('rf'),b=v('rt');if(!a||!b||a>b)return toast('Khoảng ngày không hợp lệ.',true);S.rep={from:a,to:b};main()},
  setAttClass(el){S.attClass=+el.value;S.attDate='';S.attDraft={};S.page.att=1;main()},setAttDate(el){S.attDate=el.value;S.attDraft={};S.page.att=1;main()},
  togAtt(el){const id=+el.dataset.id;S.attDraft[id]=attStatus(id)==='Present'?'Absent':'Present';main()},
  attAll(el){const c=byId(D.classes,S.attClass);D.regs.filter(r=>r.classId===c.id&&r.status==='Registered').forEach(r=>S.attDraft[r.id]=el.dataset.v);S.page.att=1;main()},
  saveAtt(){const c=byId(D.classes,S.attClass);if(!c||!S.attDate)return toast('Chưa có buổi học để điểm danh.',true);
    D.regs.filter(r=>r.classId===c.id&&r.status==='Registered').forEach(r=>{const st=attStatus(r.id),ex=D.att.find(a=>a.regId===r.id&&a.date===S.attDate);if(ex)ex.st=st;else D.att.push({regId:r.id,date:S.attDate,st})});
    S.attDraft={};log('Attendance',c.code+' '+S.attDate);toast('Đã lưu điểm danh lớp '+c.code+'.');main()}
};
function loginAs(u){S.pwOpen=false;S.user={...u};if(u.role==='Member')S.user.memberId=D.members.find(m=>m.userId===u.id)?.id;S.screen=flat(MENU[u.role])[0];S.open=undefined;S.pkg=null;S.sel=null;log('Login',u.username);render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&ACT[el.dataset.chg])ACT[el.dataset.chg](el)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;
  if(id==='q')ACT.search();else if(id==='lu'||id==='lp')ACT.login();else if(e.target.closest('.regform')&&e.target.tagName==='INPUT')ACT.register();else if(e.target.closest('.pwform')&&e.target.tagName==='INPUT')ACT.changePw();
  else if(e.target.closest('[data-fbar]')&&e.target.tagName==='INPUT')ACT.fApply({dataset:{k:e.target.closest('[data-fbar]').dataset.fbar}})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.pwOpen)ACT.closePw()});
document.addEventListener('input',e=>{const id=e.target.id,m=id&&document.getElementById('e-'+id);if(m){m.textContent='';e.target.removeAttribute('aria-invalid')}});
render();
</script>
